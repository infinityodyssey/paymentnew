# =============================================================================
# EMI repayment backend - authentication and token issuance
#
# Every ${VAR} without a fallback is a hard startup requirement. Secrets are never
# defaulted: the service refuses to run rather than run with a key from source control.
# =============================================================================
spring.application.name=payment-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Virtual threads are OFF deliberately on Java 21. A virtual thread that blocks inside a
# synchronized block pins its carrier, and Lettuce and BouncyCastle both synchronize on
# the paths this service uses constantly. Under load that starves the carrier pool and
# the service stalls rather than degrades. JEP 491 fixes it in JDK 24; until this runs on
# 24 or later, a conventional pool is the safe choice.
spring.threads.virtual.enabled=false
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
server.tomcat.threads.min-spare=25
server.tomcat.accept-count=100
server.tomcat.max-connections=8192
server.tomcat.connection-timeout=5s

# Bounded, because an unbounded queue in front of a 30s upstream is a memory leak with
# extra steps. CallerRunsPolicy on saturation: the request thread does the insert itself,
# which slows that one request instead of dropping an interaction record.
app.async.core-pool-size=8
app.async.max-pool-size=32
app.async.queue-capacity=500


server.port=${SERVER_PORT:8443}
server.forward-headers-strategy=native
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Oracle ------------------------------------------------------------------
# DDL is applied by the DBA from src/main/resources/db. The application validates
# the mapping against the live schema and never alters it.
spring.datasource.url=${ORACLE_URL}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=${ORACLE_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.default_schema=${ORACLE_SCHEMA}

# --- Redis -------------------------------------------------------------------
# Sole store for session state, nonces, OTP hashes and cached tokens. There is no
# fallback: if Redis is down the service returns 503 rather than degrading to
# per-node state, which would silently disable replay and attempt controls.
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:true}
spring.data.redis.timeout=1500ms
spring.data.redis.connect-timeout=1500ms
spring.data.redis.lettuce.pool.max-active=64
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.min-idle=4

# --- Kafka -------------------------------------------------------------------
# Metadata fan-out only. Never carries an OTP, a payment token, a full mobile
# number or a full agreement number.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP}
spring.kafka.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.properties.sasl.jaas.config=${KAFKA_JAAS_CONFIG:}
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=2000

# --- Actuator ----------------------------------------------------------------
# Separate port bound to the internal interface, authenticated scrape credential.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.prometheus.access=read-only
management.metrics.tags.application=${spring.application.name}

# --- Application -------------------------------------------------------------
app.security.token-hmac-secret=${PAYMENT_TOKEN_HMAC_SECRET}
app.security.otp-pepper=${PAYMENT_OTP_PEPPER}
app.security.session-ttl-seconds=900
app.security.payment-token-ttl-seconds=900
app.security.nonce-window-seconds=60
app.security.clock-skew-tolerance-seconds=5
app.security.require-encrypted-payloads=true
app.security.cors.allowed-origins=${ALLOWED_ORIGINS}
app.security.actuator-username=${ACTUATOR_USER:prometheus}
app.security.actuator-password=${ACTUATOR_PASSWORD}

app.otp.length=5
app.otp.ttl-seconds=180
app.otp.max-attempts=3
app.otp.resend-cooldown-seconds=60
app.otp.max-sends-per-agreement-per-hour=5
app.otp.lockout-seconds=900

# Global configuration, equivalent to the legacy globalConfiguration bean.
app.global.fiid=${GOLDLOAN_FIID:1}
app.global.lms-token-url=${GOLDLOAN_TOKEN_URL}
app.global.lms-fetch-url=${GOLDLOAN_FETCH_URL}
app.global.lms-token-json-field=${GOLDLOAN_TOKEN_FIELD:token}
app.global.lms-token-ttl-seconds=${GOLDLOAN_TOKEN_TTL:1500}
app.global.lms-timeout-seconds=30
app.global.sms-token-url=${SMS_TOKEN_URL}
app.global.sms-send-url=${SMS_SEND_URL}
app.global.sms-token-json-field=${SMS_TOKEN_FIELD:access_token}
app.global.sms-token-ttl-seconds=${SMS_TOKEN_TTL:1500}
app.global.sms-timeout-seconds=15
app.global.sms-lang=EN
app.global.sms-purpose=1001
app.global.sms-template=TPaymentGatewayLoginIT2095
app.global.sms-emp-id=APaymentGatewayLoginIT943
# DLT-registered wording. {otp} is the only substitution. Changing this text without
# re-registering the template will cause the operator to drop the message.
app.global.sms-message-template=Dear Customer, {otp} is your OTP verification code for Payment Gateway. TVS Credit
app.global.seized-sub-statuses=${GOLDLOAN_SEIZED_CASES:}

app.lms.topic=${KAFKA_LMS_TOPIC:payment.lms.interaction.v1}
app.lms.log-payloads=false

# --- Resilience --------------------------------------------------------------
# slow-call thresholds matter more than failure rate here: a 30s LMS timeout with no
# slow-call breaker holds sessions open long enough to exhaust the pool.
resilience4j.circuitbreaker.instances.lms.sliding-window-size=20
resilience4j.circuitbreaker.instances.lms.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.lms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.lms.slow-call-duration-threshold=20s
resilience4j.circuitbreaker.instances.lms.wait-duration-in-open-state=15s
resilience4j.circuitbreaker.instances.lms.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.sms.sliding-window-size=20
resilience4j.circuitbreaker.instances.sms.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.sms.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.sms.slow-call-duration-threshold=10s
resilience4j.circuitbreaker.instances.sms.wait-duration-in-open-state=15s

logging.level.root=INFO
logging.level.com.yourcompany.payment=INFO

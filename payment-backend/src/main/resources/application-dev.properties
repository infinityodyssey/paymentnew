# Local development. Still points at a real Oracle and a real Redis.
server.port=8443
spring.data.redis.ssl.enabled=false
management.server.address=0.0.0.0

# Plaintext bodies for Postman and curl. EncryptionProfileGuard refuses to start with
# this false under any profile other than dev or test.
app.security.require-encrypted-payloads=false
app.security.cors.allowed-origins=https://localhost:4200

# Writes the full LMS request and response to a dedicated logger. Never enable in prod:
# that payload carries the borrower's name, mobile number and outstanding dues.
app.lms.log-payloads=true
logging.level.LMS_PAYLOAD=DEBUG
